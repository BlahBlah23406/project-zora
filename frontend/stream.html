<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zora — Live Stream</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: #c8d8e8;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #0d1117;
      border-bottom: 1px solid #1e3a5a;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header .title {
      color: #7eb8e8;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.connected    { background: #3cbc68; box-shadow: 0 0 6px #3cbc68; }
    #status-dot.disconnected { background: #bc3c3c; }
    #status-dot.connecting   { background: #e0a040; }

    #status-label {
      font-size: 11px;
      color: #557799;
    }

    .spacer { flex: 1; }

    #clear-btn {
      background: none;
      border: 1px solid #1e3a5a;
      color: #557799;
      font-family: inherit;
      font-size: 11px;
      padding: 3px 10px;
      cursor: pointer;
      border-radius: 3px;
      transition: border-color 0.2s, color 0.2s;
    }
    #clear-btn:hover { border-color: #7eb8e8; color: #7eb8e8; }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* Auto-scroll anchor */
    #log-end { flex-shrink: 0; height: 1px; }

    .entry {
      display: flex;
      gap: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

    .entry .ts {
      color: #2a4a6a;
      flex-shrink: 0;
      user-select: none;
    }

    .entry .badge {
      flex-shrink: 0;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: bold;
      letter-spacing: 0.05em;
      align-self: flex-start;
      margin-top: 2px;
    }

    .entry .text { flex: 1; white-space: pre-wrap; word-break: break-word; }

    /* Entry types */
    .entry.user    { background: #0e1820; }
    .entry.user    .badge { background: #1a3a6a; color: #7eb8e8; }
    .entry.user    .text  { color: #a8c8e8; }

    .entry.ai      { background: #0e180e; }
    .entry.ai      .badge { background: #1a3a1a; color: #6ebc8e; }
    .entry.ai      .text  { color: #9ed8ae; }

    .entry.token   { background: transparent; }
    .entry.token   .badge { background: #1a2a1a; color: #4a8a5a; }
    .entry.token   .text  { color: #5a7a5a; font-size: 12px; }

    .entry.log     { background: #0e1410; }
    .entry.log     .badge { background: #1a2a10; color: #8ab860; }
    .entry.log     .text  { color: #8ab860; }

    .entry.error   { background: #1a0e0e; }
    .entry.error   .badge { background: #3a1a1a; color: #e06060; }
    .entry.error   .text  { color: #e06060; }

    .entry.system  { background: transparent; }
    .entry.system  .badge { background: #1a1a2a; color: #7878b0; }
    .entry.system  .text  { color: #555580; font-size: 11px; }

    .entry.plan    { background: #100e18; }
    .entry.plan    .badge { background: #2a1a4a; color: #a87ee8; }
    .entry.plan    .text  { color: #c8a8e8; }

    /* Collapsible prompt/response blocks */
    .llm-block {
      border-radius: 4px;
      margin: 2px 0;
      animation: fadeIn 0.15s ease;
    }
    .llm-block.prompt-block   { background: #0e1118; border-left: 2px solid #2a4a8a; }
    .llm-block.response-block { background: #0e180f; border-left: 2px solid #2a6a3a; }

    .llm-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 8px;
      cursor: pointer;
      user-select: none;
    }
    .llm-header:hover { background: rgba(255,255,255,0.03); }

    .llm-header .ts    { color: #2a4a6a; flex-shrink: 0; }
    .llm-header .badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: bold; letter-spacing: 0.05em; flex-shrink: 0; }
    .prompt-block   .badge { background: #1a2a5a; color: #6a9ae8; }
    .response-block .badge { background: #1a3a1a; color: #5aaa6a; }

    .llm-header .summary {
      flex: 1;
      color: #557799;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .llm-header .chevron { color: #2a4a6a; font-size: 10px; flex-shrink: 0; transition: transform 0.15s; }
    .llm-block.open .chevron { transform: rotate(90deg); }

    .llm-body {
      display: none;
      padding: 6px 10px 10px 26px;
      font-size: 12px;
      line-height: 1.5;
    }
    .llm-block.open .llm-body { display: block; }

  .llm-body .section-label {
      color: #3a6a9a;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 8px 0 3px;
    }
    .llm-body .section-label:first-child { margin-top: 0; }

    .llm-body pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #080c10;
      padding: 8px;
      border-radius: 3px;
      color: #8ab8d8;
      max-height: 300px;
      overflow-y: auto;
      font-size: 11px;
    }
    .response-block .llm-body pre { color: #7acc8a; }
    .response-block .llm-body pre.raw-pre {
      color: #8fc7ff;
      background: #0a1018;
      border-left: 2px solid #2a4a6b;
    }
    .response-block .llm-body pre.thinking-pre {
      color: #d7c07a;
      background: #12100a;
      border-left: 2px solid #6b5a2a;
    }

    /* Token stream gets collapsed: consecutive tokens merge into the previous ai bubble */
    .ai-stream-bubble {
      background: #0e180e;
      border-radius: 4px;
      padding: 4px 8px;
      display: flex;
      gap: 10px;
      animation: fadeIn 0.15s ease;
    }
    .ai-stream-bubble .badge { background: #1a3a1a; color: #4a8a5a; font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: bold; letter-spacing: 0.05em; align-self: flex-start; margin-top: 2px; flex-shrink: 0; }
    .ai-stream-bubble .text  { flex: 1; white-space: pre-wrap; word-break: break-word; color: #6ebc8e; font-size: 12px; }
    .ai-stream-bubble .ts    { color: #2a4a6a; flex-shrink: 0; user-select: none; }

    /* Filter bar */
    #filter-bar {
      background: #0d1117;
      border-top: 1px solid #1e3a5a;
      padding: 7px 18px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: none;
      border: 1px solid #1e3a5a;
      color: #557799;
      font-family: inherit;
      font-size: 11px;
      padding: 2px 9px;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.15s;
    }
    .filter-btn.active { border-color: #7eb8e8; color: #7eb8e8; background: #0e1820; }
    .filter-btn:hover  { border-color: #557799; }
  </style>
</head>
<body>

<header>
  <div id="status-dot" class="connecting"></div>
  <div class="title">Zora Live Stream</div>
  <div id="status-label">connecting…</div>
  <div class="spacer"></div>
  <button id="clear-btn">Clear</button>
</header>

<div id="log">
  <div id="log-end"></div>
</div>

<div id="filter-bar">
  <span style="color:#557799;font-size:11px;align-self:center;margin-right:4px;">Show:</span>
  <button class="filter-btn active" data-type="user">User</button>
  <button class="filter-btn active" data-type="ai">AI</button>
  <button class="filter-btn active" data-type="tokens">Tokens</button>
  <button class="filter-btn active" data-type="log">Log</button>
  <button class="filter-btn active" data-type="error">Errors</button>
  <button class="filter-btn active" data-type="plan">Plan</button>
  <button class="filter-btn active" data-type="prompt">Prompts</button>
  <button class="filter-btn active" data-type="response">Responses</button>
  <button class="filter-btn active" data-type="system">System</button>
</div>

<script>
'use strict';

const logEl   = document.getElementById('log');
const logEnd  = document.getElementById('log-end');
const dot     = document.getElementById('status-dot');
const statusL = document.getElementById('status-label');

// Filter state
const filters = { user: true, ai: true, tokens: true, log: true, error: true, system: true, plan: true, prompt: true, response: true };
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.type;
    filters[t] = !filters[t];
    btn.classList.toggle('active', filters[t]);
    // Hide/show existing entries
    document.querySelectorAll(`[data-type="${t}"]`).forEach(el => {
      el.style.display = filters[t] ? '' : 'none';
    });
  });
});

document.getElementById('clear-btn').addEventListener('click', () => {
  logEl.innerHTML = '';
  logEl.appendChild(logEnd);
  activeBubble = null;
});

// Timestamps
function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// Auto-scroll: only scroll if already near bottom
function maybeScroll() {
  const threshold = 80;
  const atBottom  = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < threshold;
  if (atBottom) logEnd.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function appendEntry(type, badge, text, ts, extraClass = '') {
  if (!filters[type === 'ai_done' || type === 'token' ? (type === 'token' ? 'tokens' : 'ai') : type]) {
    // still create but hide
  }
  const div = document.createElement('div');
  div.className = `entry ${extraClass || type}`;
  div.dataset.type = type === 'token' ? 'tokens' : (type === 'ai_done' ? 'ai' : type);
  if (!filters[div.dataset.type]) div.style.display = 'none';
  div.innerHTML = `<span class="ts">${fmtTime(ts)}</span><span class="badge">${badge}</span><span class="text">${escHtml(text)}</span>`;
  logEl.insertBefore(div, logEnd);
  maybeScroll();
  return div;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Active streaming bubble — collapses tokens into one block
let activeBubble = null;

function getOrCreateBubble(ts) {
  if (activeBubble) return activeBubble;
  const div = document.createElement('div');
  div.className = 'ai-stream-bubble';
  div.dataset.type = 'tokens';
  if (!filters.tokens) div.style.display = 'none';
  div.innerHTML = `<span class="ts">${fmtTime(ts)}</span><span class="badge">STREAM</span><span class="text"></span>`;
  logEl.insertBefore(div, logEnd);
  activeBubble = div;
  return div;
}

function appendLlmBlock(kind, evt) {
  const filterKey = kind; // 'prompt' or 'response'
  const isPrompt  = kind === 'prompt';
  const blockCls  = isPrompt ? 'prompt-block' : 'response-block';
  const badge     = isPrompt ? 'PROMPT' : 'RESPONSE';

  // Build summary line
  let summary;
  if (isPrompt) {
    const text = evt.prompt || '';
    summary = `[${evt.mode}] ${text.slice(0, 120).replace(/\n/g, ' ')}`;
  } else {
    const preview = evt.rawResponse || evt.response || evt.thinking || '[empty]';
    summary = `[${evt.mode}] ${preview.slice(0, 120).replace(/\n/g, ' ')}`;
  }

  const div = document.createElement('div');
  div.className = `llm-block ${blockCls}`;
  div.dataset.type = filterKey;
  if (!filters[filterKey]) div.style.display = 'none';

  // Header
  const header = document.createElement('div');
  header.className = 'llm-header';
  header.innerHTML = `
    <span class="ts">${fmtTime(evt.ts)}</span>
    <span class="badge">${badge}</span>
    <span class="summary">${escHtml(summary)}</span>
    <span class="chevron">▶</span>`;
  header.addEventListener('click', () => div.classList.toggle('open'));

  // Body
  const body = document.createElement('div');
  body.className = 'llm-body';

  if (isPrompt) {
    let html = '';
    if (evt.system) {
      html += `<div class="section-label">System</div><pre>${escHtml(evt.system)}</pre>`;
    }
    if (evt.prompt) {
      html += `<div class="section-label">Prompt</div><pre>${escHtml(evt.prompt)}</pre>`;
    }
    body.innerHTML = html;
  } else {
    let html = '';
    html += `<div class="section-label">Raw Output</div><pre class="raw-pre">${escHtml(evt.rawResponse || evt.response || '')}</pre>`;
    if (evt.thinking) {
      html += `<div class="section-label">Thinking</div><pre class="thinking-pre">${escHtml(evt.thinking)}</pre>`;
    }
    html += `<div class="section-label">Final Response</div><pre>${escHtml(evt.response || evt.rawResponse || '')}</pre>`;
    body.innerHTML = html;
  }

  div.appendChild(header);
  div.appendChild(body);
  logEl.insertBefore(div, logEnd);
  maybeScroll();
}

function handleEvent(evt) {
  const { type, token, text, ts = Date.now() } = evt;

  if (type === 'connected') {
    dot.className = 'connected';
    statusL.textContent = 'connected';
    appendEntry('system', 'SYS', 'Stream connected', ts, 'system');
    return;
  }

  if (type === 'user') {
    activeBubble = null; // close any open stream bubble
    appendEntry('user', 'YOU', text, ts, 'user');
    return;
  }

  if (type === 'token') {
    const bubble = getOrCreateBubble(ts);
    bubble.querySelector('.text').textContent += token;
    maybeScroll();
    return;
  }

  if (type === 'ai_done') {
    // Close streaming bubble, add final AI entry
    activeBubble = null;
    appendEntry('ai_done', 'ZORA', text, ts, 'ai');
    return;
  }

  if (type === 'plan_step') {
    appendEntry('plan', 'PLAN', text, ts, 'plan');
    return;
  }

  if (type === 'prompt') {
    appendLlmBlock('prompt', evt);
    return;
  }

  if (type === 'response') {
    appendLlmBlock('response', evt);
    return;
  }

  if (type === 'log') {
    appendEntry('log', 'LOG', text, ts, 'log');
    return;
  }

  if (type === 'error') {
    activeBubble = null;
    appendEntry('error', 'ERR', text, ts, 'error');
    return;
  }
}

// ── SSE connection with auto-reconnect ───────────────────────────────────────

let es = null;
let retryDelay = 1000;

function connect() {
  dot.className = 'connecting';
  statusL.textContent = 'connecting…';

  es = new EventSource('/api/events');

  es.onopen = () => {
    retryDelay = 1000;
  };

  es.onmessage = (e) => {
    try {
      handleEvent(JSON.parse(e.data));
    } catch (err) {
      console.warn('Stream parse error:', err);
    }
  };

  es.onerror = () => {
    dot.className = 'disconnected';
    statusL.textContent = `disconnected — retrying in ${retryDelay / 1000}s`;
    es.close();
    setTimeout(() => {
      retryDelay = Math.min(retryDelay * 2, 30_000);
      connect();
    }, retryDelay);
  };
}

connect();
</script>
</body>
</html>
